# Builds the website (website/) and publishes it from the root of main.
# GitHub Pages is set to "Deploy from a branch" (main, /), which serves files as they are and cannot run the
# Next.js build. So this workflow builds the static site and commits it to the repository root, with
# .nojekyll so GitHub serves it as plain files. .pages-files lists every file the last publish wrote, so a
# page that is removed from the site is removed from the root too.
# If a repository admin switches Pages to "GitHub Actions", upload website/out as a Pages artifact instead
# and delete the generated files at the root.
name: Publish the website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# One publish at a time; a run in progress finishes rather than being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      # The site lives at https://kellislab.github.io/MantisDiscovery/. For a custom domain, set
      # PAGES_BASE_PATH to "" and NEXT_PUBLIC_SITE_URL to the domain.
      - run: npm run build
        working-directory: website
        env:
          PAGES_BASE_PATH: /MantisDiscovery
          NEXT_PUBLIC_SITE_URL: https://kellislab.github.io/MantisDiscovery
      - name: Copy the build to the repository root
        run: |
          if [ -f .pages-files ]; then
            while IFS= read -r f; do rm -f -- "$f"; done < .pages-files
          fi
          cp -R website/out/. .
          (cd website/out && find . -type f | sed 's|^\./||' | LC_ALL=C sort) > .pages-files
          touch .nojekyll
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The published site is already up to date."
            exit 0
          fi
          git commit -m "Publish the website"
          git pull --rebase
          git push
      # A push made with the workflow token may not start a Pages build by itself, so ask for one.
      - name: Rebuild GitHub Pages
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
